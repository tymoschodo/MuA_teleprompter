<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teleprompter — Einstellungen</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0f;
    --surface: #1a1a1d;
    --surface2: #242428;
    --border: #2e2e33;
    --accent: #e8ff47;
    --accent2: #ff6b35;
    --text: #f0efe8;
    --muted: #888780;
    --danger: #ff4444;
    --font-display: 'Syne', sans-serif;
    --font-mono: 'Space Mono', monospace;
    --radius: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-display); min-height: 100vh; padding: 2rem; }
  h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.03em; color: var(--accent); margin-bottom: 0.25rem; }
  h2 { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 1rem; }
  h3 { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.6rem; }

  .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; max-width: 1100px; margin: 0 auto; }
  .layout-header { grid-column: 1/-1; display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; flex-wrap: wrap; gap: 1rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; }
  .card-full { grid-column: 1/-1; }

  .launch-bar { display: flex; gap: 0.75rem; flex-wrap: wrap; }
  .btn { font-family: var(--font-display); font-size: 0.85rem; font-weight: 700; letter-spacing: 0.04em; padding: 0.6rem 1.2rem; border-radius: var(--radius); border: 1.5px solid var(--border); background: var(--surface2); color: var(--text); cursor: pointer; transition: all 0.15s; text-decoration: none; display: inline-block; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-accent { background: var(--accent); color: #0e0e0f; border-color: var(--accent); }
  .btn-accent:hover { background: #fff; border-color: #fff; color: #0e0e0f; }
  .btn-danger { border-color: var(--danger); color: var(--danger); background: transparent; }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  .btn-sm { font-size: 0.75rem; padding: 0.35rem 0.8rem; }

  label { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 0.4rem; margin-top: 0.9rem; }
  label:first-child { margin-top: 0; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text); font-family: var(--font-mono);
    font-size: 0.85rem; padding: 0.55rem 0.75rem; transition: border 0.15s;
  }
  input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; min-height: 100px; }
  select option { background: #1a1a1d; }

  input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
  .range-row { display: flex; align-items: center; gap: 0.75rem; }
  .range-val { font-family: var(--font-mono); font-size: 0.85rem; color: var(--accent); min-width: 3.5rem; text-align: right; }

  .text-list { display: flex; flex-direction: column; gap: 0.4rem; max-height: 360px; overflow-y: auto; padding-right: 4px; }
  .text-list::-webkit-scrollbar { width: 4px; }
  .text-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .text-item { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.6rem 0.85rem; cursor: pointer; transition: border-color 0.15s; display: flex; align-items: center; gap: 0.75rem; }
  .text-item:hover { border-color: var(--muted); }
  .text-item.active { border-color: var(--accent); }
  .text-num { font-family: var(--font-mono); font-size: 0.65rem; color: var(--muted); min-width: 1.5rem; }
  .text-title { font-size: 0.85rem; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .color-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.4rem; }
  .color-swatch { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: border 0.15s; }
  .color-swatch:hover { transform: scale(1.15); }
  .color-swatch.sel { border-color: var(--accent); }

  .info-strip { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); margin-top: 1rem; padding-top: 0.9rem; border-top: 1px solid var(--border); }
  .info-strip span { color: var(--accent); }

  .toggle-row { display: flex; align-items: center; gap: 0.75rem; margin-top: 0.85rem; }
  .toggle { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
  .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
  .toggle-slider { position: absolute; inset: 0; background: var(--surface2); border: 1px solid var(--border); border-radius: 11px; cursor: pointer; transition: 0.2s; }
  .toggle-slider::after { content: ''; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px; background: var(--muted); border-radius: 50%; transition: 0.2s; }
  .toggle input:checked + .toggle-slider { background: var(--accent); border-color: var(--accent); }
  .toggle input:checked + .toggle-slider::after { transform: translateX(18px); background: #0e0e0f; }
  .toggle-label { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }

  @media (max-width: 700px) { .layout { grid-template-columns: 1fr; } .card-full, .card { grid-column: 1/-1; } }
</style>
</head>
<body>
<div class="layout">
  <div class="layout-header">
    <div>
      <h1>TELEPROMPTER</h1>
      <p style="font-size:0.75rem;color:var(--muted);margin-top:0.2rem;font-family:var(--font-mono)">MuA — Einstellungen</p>
    </div>
    <div class="launch-bar">
      <a class="btn" href="conductor.html" target="_blank">⊞ Dirigent</a>
      <a class="btn btn-accent" href="projection.html" target="_blank">▶ Projektion</a>
    </div>
  </div>

  <!-- Text list -->
  <div class="card" style="grid-row: span 2;">
    <h2>Texte</h2>
    <div class="text-list" id="textList"></div>
    <div style="display:flex;gap:0.5rem;margin-top:0.75rem;flex-wrap:wrap;">
      <button class="btn btn-sm" onclick="addText()">+ Neu</button>
      <button class="btn btn-sm btn-danger" onclick="deleteText()">Löschen</button>
      <button class="btn btn-sm" onclick="moveUp()">↑</button>
      <button class="btn btn-sm" onclick="moveDown()">↓</button>
    </div>
  </div>

  <!-- Text editor -->
  <div class="card">
    <h2>Text bearbeiten</h2>
    <label>Titel</label>
    <input type="text" id="editTitle" placeholder="z.B. Arie I — Liebe" oninput="saveEdit()">
    <label>Inhalt</label>
    <textarea id="editContent" rows="8" placeholder="Text hier eingeben…" oninput="saveEdit()"></textarea>
    <div class="info-strip" id="editInfo">Kein Text ausgewählt</div>
  </div>

  <!-- Scroll settings -->
  <div class="card">
    <h2>Scroll-Einstellungen</h2>
    <label>Richtung</label>
    <select id="settDir" onchange="saveSettings()">
      <option value="up">↑ Unten → Oben (klassisch)</option>
      <option value="down">↓ Oben → Unten</option>
      <option value="left">← Rechts → Links</option>
      <option value="right">→ Links → Rechts</option>
      <option value="diag-ul">↖ Diagonal oben-links</option>
      <option value="diag-ur">↗ Diagonal oben-rechts</option>
      <option value="diag-dl">↙ Diagonal unten-links</option>
      <option value="diag-dr">↘ Diagonal unten-rechts</option>
    </select>

    <label>Scrollgeschwindigkeit</label>
    <div class="range-row">
      <input type="range" id="settSpeed" min="10" max="300" step="5" value="60" oninput="saveSettings();document.getElementById('speedVal').textContent=this.value+' px/s'">
      <span class="range-val" id="speedVal">60 px/s</span>
    </div>

    <label>Schriftgröße</label>
    <div class="range-row">
      <input type="range" id="settSize" min="24" max="160" step="2" value="72" oninput="saveSettings();document.getElementById('sizeVal').textContent=this.value+'px'">
      <span class="range-val" id="sizeVal">72px</span>
    </div>

    <label>Zeilenabstand</label>
    <div class="range-row">
      <input type="range" id="settLineH" min="10" max="30" step="1" value="16" oninput="saveSettings();document.getElementById('lineHVal').textContent=(this.value/10).toFixed(1)">
      <span class="range-val" id="lineHVal">1.6</span>
    </div>

    <div class="toggle-row">
      <label class="toggle"><input type="checkbox" id="settKeepText" onchange="saveSettings()"><span class="toggle-slider"></span></label>
      <span class="toggle-label">Vergangener Text bleibt sichtbar</span>
    </div>
    <div class="toggle-row">
      <label class="toggle"><input type="checkbox" id="settMirror" onchange="saveSettings()"><span class="toggle-slider"></span></label>
      <span class="toggle-label">Text horizontal spiegeln</span>
    </div>
  </div>

  <!-- Visual settings -->
  <div class="card">
    <h2>Erscheinungsbild</h2>
    <label>Schriftart</label>
    <select id="settFont" onchange="saveSettings()">
      <option value="'Syne', sans-serif">Syne</option>
      <option value="'Space Mono', monospace">Space Mono</option>
      <option value="Georgia, serif">Georgia</option>
      <option value="'Times New Roman', serif">Times New Roman</option>
      <option value="Impact, sans-serif">Impact</option>
      <option value="'Arial', sans-serif">Arial</option>
      <option value="'Helvetica Neue', sans-serif">Helvetica Neue</option>
    </select>

    <label>Textfarbe</label>
    <div class="color-row" id="colorSwatches"></div>

    <label>Hintergrundfarbe</label>
    <div class="color-row" id="bgSwatches"></div>

    <label>Ausrichtung</label>
    <select id="settAlign" onchange="saveSettings()">
      <option value="left">Linksbündig</option>
      <option value="center">Zentriert</option>
      <option value="right">Rechtsbündig</option>
    </select>

    <label>Seitenränder</label>
    <div class="range-row">
      <input type="range" id="settPad" min="0" max="300" step="10" value="80" oninput="saveSettings();document.getElementById('padVal').textContent=this.value+'px'">
      <span class="range-val" id="padVal">80px</span>
    </div>

    <label>Schriftgewicht</label>
    <select id="settWeight" onchange="saveSettings()">
      <option value="400">Normal</option>
      <option value="600">Halbfett</option>
      <option value="700" selected>Fett</option>
      <option value="800">Sehr fett</option>
    </select>
  </div>

  <!-- Footer / data -->
  <div class="card card-full" style="display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap;">
    <h3 style="margin:0;">Daten:</h3>
    <button class="btn btn-sm" onclick="exportData()">↓ Exportieren</button>
    <button class="btn btn-sm" onclick="document.getElementById('importFile').click()">↑ Importieren</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    <button class="btn btn-sm btn-danger" onclick="if(confirm('Alle Texte zurücksetzen?'))initDefaultTexts()">↺ Zurücksetzen</button>
    <span style="font-family:var(--font-mono);font-size:0.65rem;color:var(--muted);margin-left:auto;">Leertaste / Fußpedal = nächsten Text starten</span>
  </div>
</div>

<script>
const STORE = 'tp_';
const TEXT_COLORS = ['#f0efe8','#ffffff','#e8ff47','#ff6b35','#00ffcc','#ffaacc','#aaddff'];
const BG_COLORS   = ['#000000','#0e0e0f','#1a1a1d','#0a0a20','#0d1a0d','#200a0a','#1a1500'];

let texts = [], selIdx = 0;

function getSettings() { return JSON.parse(localStorage.getItem(STORE+'settings') || '{}'); }

function saveSettings() {
  const s = {
    dir:      document.getElementById('settDir').value,
    speed:    +document.getElementById('settSpeed').value,
    size:     +document.getElementById('settSize').value,
    lineH:    +(document.getElementById('settLineH').value / 10).toFixed(1),
    keepText: document.getElementById('settKeepText').checked,
    mirror:   document.getElementById('settMirror').checked,
    font:     document.getElementById('settFont').value,
    align:    document.getElementById('settAlign').value,
    pad:      +document.getElementById('settPad').value,
    weight:   document.getElementById('settWeight').value,
    textColor: activeColor('colorSwatches') || '#f0efe8',
    bgColor:   activeColor('bgSwatches')    || '#000000',
  };
  localStorage.setItem(STORE+'settings', JSON.stringify(s));
  broadcast({ type: 'settings', data: s });
}

function loadSettingsUI() {
  const s = getSettings();
  const set = (id, val) => { if (val !== undefined && document.getElementById(id)) document.getElementById(id).value = val; };
  if (s.dir)    set('settDir', s.dir);
  if (s.speed)  { set('settSpeed', s.speed);  document.getElementById('speedVal').textContent = s.speed + ' px/s'; }
  if (s.size)   { set('settSize', s.size);    document.getElementById('sizeVal').textContent  = s.size  + 'px'; }
  if (s.lineH)  { set('settLineH', s.lineH*10); document.getElementById('lineHVal').textContent = parseFloat(s.lineH).toFixed(1); }
  if (s.keepText !== undefined) document.getElementById('settKeepText').checked = s.keepText;
  if (s.mirror  !== undefined) document.getElementById('settMirror').checked   = s.mirror;
  if (s.font)   set('settFont', s.font);
  if (s.align)  set('settAlign', s.align);
  if (s.pad !== undefined) { set('settPad', s.pad); document.getElementById('padVal').textContent = s.pad + 'px'; }
  if (s.weight) set('settWeight', s.weight);
}

function activeColor(id) {
  const el = document.querySelector('#' + id + ' .color-swatch.sel');
  return el ? el.dataset.c : null;
}

function buildSwatches(id, colors, key, def) {
  const cont = document.getElementById(id);
  cont.innerHTML = '';
  const cur = getSettings()[key] || def;
  colors.forEach(c => {
    const d = document.createElement('div');
    d.className = 'color-swatch' + (c === cur ? ' sel' : '');
    d.style.background = c;
    d.style.outline = c === '#000000' ? '1px solid #333' : '';
    d.dataset.c = c;
    d.title = c;
    d.onclick = () => { cont.querySelectorAll('.color-swatch').forEach(x => x.classList.remove('sel')); d.classList.add('sel'); saveSettings(); };
    cont.appendChild(d);
  });
}

function saveTexts() {
  localStorage.setItem(STORE+'texts', JSON.stringify(texts));
  broadcast({ type: 'texts', data: texts });
}

function loadTexts() {
  const raw = localStorage.getItem(STORE+'texts');
  if (raw) texts = JSON.parse(raw);
  else initDefaultTexts(false);
  renderList(); selectText(0);
}

function initDefaultTexts(save = true) {
  texts = Array.from({ length: 20 }, (_, i) => ({
    id: Date.now() + i,
    title: `Text ${i + 1}`,
    content: `Hier kommt der ${i + 1}. Text für den Schauspieler.\n\nDieser Text wird vom Dirigenten mit dem Fußpedal gestartet.\n\nPlatzhalterinhalt — bitte ersetzen.`,
    status: 'waiting'
  }));
  if (save) { saveTexts(); renderList(); selectText(0); }
  else      { renderList(); selectText(0); }
}

function renderList() {
  const el = document.getElementById('textList');
  el.innerHTML = '';
  texts.forEach((t, i) => {
    const d = document.createElement('div');
    d.className = 'text-item' + (i === selIdx ? ' active' : '');
    d.innerHTML = `<span class="text-num">${String(i+1).padStart(2,'0')}</span><span class="text-title">${t.title || '(kein Titel)'}</span>`;
    d.onclick = () => selectText(i);
    el.appendChild(d);
  });
}

function selectText(i) {
  if (i < 0 || i >= texts.length) return;
  selIdx = i;
  renderList();
  const t = texts[i];
  document.getElementById('editTitle').value   = t.title   || '';
  document.getElementById('editContent').value = t.content || '';
  updateEditInfo();
}

function updateEditInfo() {
  const words = (document.getElementById('editContent').value || '').split(/\s+/).filter(Boolean).length;
  document.getElementById('editInfo').innerHTML =
    `Text <span>${selIdx + 1} / ${texts.length}</span> &nbsp;·&nbsp; <span>${words}</span> Wörter`;
}

function saveEdit() {
  if (selIdx < 0 || selIdx >= texts.length) return;
  texts[selIdx].title   = document.getElementById('editTitle').value;
  texts[selIdx].content = document.getElementById('editContent').value;
  saveTexts(); renderList(); updateEditInfo();
}

function addText() {
  texts.push({ id: Date.now(), title: `Text ${texts.length + 1}`, content: '', status: 'waiting' });
  saveTexts(); renderList(); selectText(texts.length - 1);
}

function deleteText() {
  if (texts.length <= 1) return;
  if (!confirm(`"${texts[selIdx].title}" wirklich löschen?`)) return;
  texts.splice(selIdx, 1);
  selIdx = Math.min(selIdx, texts.length - 1);
  saveTexts(); renderList(); selectText(selIdx);
}

function moveUp() {
  if (selIdx <= 0) return;
  [texts[selIdx-1], texts[selIdx]] = [texts[selIdx], texts[selIdx-1]];
  selIdx--; saveTexts(); renderList(); selectText(selIdx);
}
function moveDown() {
  if (selIdx >= texts.length - 1) return;
  [texts[selIdx], texts[selIdx+1]] = [texts[selIdx+1], texts[selIdx]];
  selIdx++; saveTexts(); renderList(); selectText(selIdx);
}

function broadcast(msg) {
  localStorage.setItem(STORE+'msg', JSON.stringify({ ...msg, ts: Date.now() }));
}

function exportData() {
  const blob = new Blob([JSON.stringify({ texts, settings: getSettings() }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'teleprompter-daten.json';
  a.click();
}

function importData(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      if (d.texts)    { texts = d.texts; saveTexts(); renderList(); selectText(0); }
      if (d.settings) {
        localStorage.setItem(STORE+'settings', JSON.stringify(d.settings));
        loadSettingsUI();
        buildSwatches('colorSwatches', TEXT_COLORS, 'textColor', '#f0efe8');
        buildSwatches('bgSwatches',    BG_COLORS,   'bgColor',   '#000000');
      }
    } catch(err) { alert('Fehler beim Importieren: ' + err.message); }
  };
  r.readAsText(f);
}

function init() {
  loadTexts();
  buildSwatches('colorSwatches', TEXT_COLORS, 'textColor', '#f0efe8');
  buildSwatches('bgSwatches',    BG_COLORS,   'bgColor',   '#000000');
  loadSettingsUI();
  if (!getSettings().dir) saveSettings();
}
init();
</script>
</body>
</html>
