<!DOCTYPE html>
<html lang="de"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Projektion — Hinten / Titel</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@100;200;300;400;500;600;700;800;900&family=Julius+Sans+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;cursor:none}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden}
#wrap{position:absolute;left:0;top:0;width:100%;will-change:transform,opacity}
#content{white-space:pre-wrap;word-break:break-word}
#tag{position:fixed;bottom:.8rem;right:1.2rem;font-family:"Space Mono",monospace;font-size:.65rem;color:rgba(128,128,128,.2);pointer-events:none;z-index:10}
#hint{position:fixed;bottom:.8rem;left:50%;transform:translateX(-50%);font-family:"Space Mono",monospace;font-size:.62rem;color:rgba(128,128,128,.2);pointer-events:none;z-index:10;transition:opacity 1s}
</style>
</head><body>
<div id="stage"><div id="wrap"><div id="content"></div></div></div>
<div id="tag"></div><div id="hint">F — Vollbild</div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-sync.js"></script>
<script src="projection-engine.js"></script>
<script>
initProjection({ namespace:"tp_back_", defaultBg:"#000000", defaultColor:"#f0efe8", defaultMode:"display" });
</script>
</body></html>
