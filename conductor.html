<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Teleprompter — Dirigent</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0b;
    --surface: #141417;
    --surface2: #1e1e22;
    --border: #2a2a30;
    --accent: #e8ff47;
    --accent2: #ff6b35;
    --text: #f0efe8;
    --muted: #666;
    --danger: #ff4444;
    --green: #44dd88;
    --font-display: 'Syne', sans-serif;
    --font-mono: 'Space Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-display); display: flex; flex-direction: column; }

  /* Top bar */
  .topbar { display: flex; align-items: center; gap: 0.75rem; padding: 0.85rem 1.25rem; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .topbar-title { font-size: 0.9rem; font-weight: 800; letter-spacing: 0.06em; color: var(--accent); }
  .pill { font-family: var(--font-mono); font-size: 0.65rem; padding: 0.2rem 0.6rem; border-radius: 3px; border: 1px solid var(--border); letter-spacing: 0.04em; }
  .pill-idle    { color: var(--muted); border-color: var(--border); }
  .pill-running { color: var(--accent2); border-color: var(--accent2); animation: blink 1.2s ease infinite; }
  .pill-paused  { color: var(--accent); border-color: var(--accent); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* Progress panel */
  .prog-panel { padding: 1rem 1.25rem 0.85rem; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .prog-label  { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.35rem; }
  .prog-title  { font-size: 1.15rem; font-weight: 800; min-height: 1.6rem; margin-bottom: 0.7rem; line-height: 1.2; }
  .prog-bar    { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; margin-bottom: 0.35rem; }
  .prog-fill   { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 3px; transition: width 0.4s ease; width: 0%; }
  .prog-meta   { display: flex; justify-content: space-between; align-items: baseline; }
  .prog-pct    { font-family: var(--font-mono); font-size: 1.6rem; font-weight: 700; color: var(--accent); line-height: 1; }
  .prog-sub    { font-family: var(--font-mono); font-size: 0.65rem; color: var(--muted); text-align: right; line-height: 1.5; }

  /* Big CUE button */
  .cue-zone { padding: 0.85rem 1.25rem; border-bottom: 1px solid var(--border); flex-shrink: 0; display: flex; gap: 0.65rem; align-items: center; }
  .btn-cue { flex: 1; font-family: var(--font-display); font-size: 1.1rem; font-weight: 800; letter-spacing: 0.06em; padding: 1rem; border-radius: 6px; border: none; background: var(--accent); color: #0a0a0b; cursor: pointer; transition: all 0.12s; touch-action: manipulation; }
  .btn-cue:active { transform: scale(0.97); background: #fff; }
  .btn-cue:disabled { opacity: 0.25; cursor: default; }
  .btn { font-family: var(--font-display); font-size: 0.8rem; font-weight: 700; padding: 0.7rem 1rem; border-radius: 6px; border: 1.5px solid var(--border); background: var(--surface2); color: var(--text); cursor: pointer; transition: all 0.12s; touch-action: manipulation; white-space: nowrap; }
  .btn:active { transform: scale(0.96); }
  .btn-pause { border-color: var(--accent2); color: var(--accent2); }
  .btn-pause:active { background: var(--accent2); color: #0a0a0b; }
  .btn-stop  { border-color: var(--danger); color: var(--danger); }
  .btn-stop:active  { background: var(--danger); color: #fff; }
  .btn:disabled { opacity: 0.25; cursor: default; }

  /* Text list */
  .list-wrap { flex: 1; overflow-y: auto; padding: 0.6rem 0.9rem; -webkit-overflow-scrolling: touch; }
  .list-wrap::-webkit-scrollbar { width: 3px; }
  .list-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .t-item { padding: 0.75rem 0.9rem; border-radius: 5px; border: 1px solid transparent; margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.7rem; transition: all 0.2s; }
  .t-item.waiting { opacity: 0.4; }
  .t-item.active  { border-color: var(--accent2); background: rgba(255,107,53,0.08); opacity: 1; }
  .t-item.done    { border-color: rgba(68,221,136,0.25); background: rgba(68,221,136,0.04); opacity: 0.7; }
  .t-num   { font-family: var(--font-mono); font-size: 0.6rem; color: var(--muted); min-width: 1.4rem; }
  .t-name  { font-size: 0.85rem; font-weight: 600; flex: 1; }
  .t-icon  { font-size: 0.8rem; }

  .hint { text-align: center; padding: 0.55rem; font-family: var(--font-mono); font-size: 0.6rem; color: var(--muted); border-top: 1px solid var(--border); flex-shrink: 0; }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">DIRIGENT</span>
  <span class="pill pill-idle" id="pill">BEREIT</span>
  <span style="margin-left:auto;font-family:var(--font-mono);font-size:0.6rem;color:var(--muted)" id="idxDisplay">—</span>
</div>

<div class="prog-panel">
  <div class="prog-label">Aktueller Text</div>
  <div class="prog-title" id="curTitle">—</div>
  <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
  <div class="prog-meta">
    <div class="prog-pct" id="progPct">0%</div>
    <div class="prog-sub" id="progSub">0:00<br>0 / 0 Wörter</div>
  </div>
</div>

<div class="cue-zone">
  <button class="btn-cue" id="btnCue" onclick="doCue()">▶ CUE</button>
  <button class="btn btn-pause" id="btnPause" onclick="doPause()" disabled>⏸</button>
  <button class="btn btn-stop"  id="btnStop"  onclick="doStop()"  disabled>⏹</button>
</div>

<div class="list-wrap" id="listWrap"></div>
<div class="hint">Leertaste oder Fußpedal → CUE</div>

<script>
const STORE = 'tp_';
let texts = [], curIdx = -1, state = 'idle';
let progInterval = null, startTime = 0, totalDuration = 0, totalWords = 0;
let pausedAt = 0, pausedElapsed = 0;

function getSettings() { return JSON.parse(localStorage.getItem(STORE+'settings') || '{}'); }

function broadcast(msg) {
  localStorage.setItem(STORE+'msg', JSON.stringify({ ...msg, ts: Date.now() }));
}

function loadTexts() {
  const raw = localStorage.getItem(STORE+'texts');
  texts = raw ? JSON.parse(raw) : [];
  renderList();
}

function renderList() {
  const el = document.getElementById('listWrap');
  el.innerHTML = '';
  texts.forEach((t, i) => {
    const d = document.createElement('div');
    const cls = i === curIdx ? 'active' : (t.status === 'done' ? 'done' : 'waiting');
    const icon = i === curIdx
      ? (state === 'running' ? '►' : state === 'paused' ? '⏸' : '·')
      : (t.status === 'done' ? '✓' : '');
    d.className = 't-item ' + cls;
    d.innerHTML = `<span class="t-num">${String(i+1).padStart(2,'0')}</span><span class="t-name">${t.title||'(kein Titel)'}</span><span class="t-icon">${icon}</span>`;
    el.appendChild(d);
  });
  if (curIdx >= 0) {
    const items = el.querySelectorAll('.t-item');
    if (items[curIdx]) items[curIdx].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

function setState(s) {
  state = s;
  const pill = document.getElementById('pill');
  const labels = { idle: ['BEREIT','pill-idle'], running: ['LÄUFT','pill-running'], paused: ['PAUSE','pill-paused'] };
  const [txt, cls] = labels[s];
  pill.textContent = txt;
  pill.className = 'pill ' + cls;
  document.getElementById('btnPause').disabled = (s === 'idle');
  document.getElementById('btnStop').disabled  = (s === 'idle');
  document.getElementById('btnCue').disabled   = (s === 'running');
}

function doCue() {
  if (state === 'running') return;
  const next = curIdx + 1;
  if (next >= texts.length) { alert('Alle ' + texts.length + ' Texte wurden gezeigt!'); return; }
  if (curIdx >= 0 && texts[curIdx]) texts[curIdx].status = 'done';
  curIdx = next;
  texts[curIdx].status = 'active';
  document.getElementById('curTitle').textContent = texts[curIdx].title || '(kein Titel)';
  document.getElementById('idxDisplay').textContent = (curIdx+1) + ' / ' + texts.length;
  totalWords = (texts[curIdx].content || '').split(/\s+/).filter(Boolean).length;
  pausedElapsed = 0;
  resetProgress();
  setState('running');
  broadcast({ type: 'cue', idx: curIdx });
  startProgress();
  renderList();
}

function doPause() {
  if (state === 'running') {
    clearInterval(progInterval);
    pausedElapsed += Date.now() - startTime;
    setState('paused');
    broadcast({ type: 'pause' });
  } else if (state === 'paused') {
    startTime = Date.now();
    startProgress();
    setState('running');
    broadcast({ type: 'resume' });
  }
  renderList();
}

function doStop() {
  clearInterval(progInterval);
  if (curIdx >= 0 && texts[curIdx]) texts[curIdx].status = 'waiting';
  setState('idle');
  resetProgress();
  broadcast({ type: 'stop' });
  renderList();
}

function resetProgress() {
  document.getElementById('progFill').style.width = '0%';
  document.getElementById('progPct').textContent  = '0%';
  document.getElementById('progSub').innerHTML    = '0:00<br>0 / ' + totalWords + ' Wörter';
}

function startProgress() {
  clearInterval(progInterval);
  const s = getSettings();
  const speed  = s.speed  || 60;
  const size   = s.size   || 72;
  const lineH  = s.lineH  || 1.6;
  const t = texts[curIdx]; if (!t) return;
  const estLines = (t.content||'').split('\n').reduce((a, l) => a + Math.max(1, Math.ceil(l.length / 28)), 0);
  const totalPx  = estLines * (size * lineH);
  totalDuration  = (totalPx / speed) * 1000;
  startTime = Date.now();

  progInterval = setInterval(() => {
    const elapsed = pausedElapsed + (Date.now() - startTime);
    const pct = Math.min(100, Math.round((elapsed / totalDuration) * 100));
    document.getElementById('progFill').style.width = pct + '%';
    document.getElementById('progPct').textContent  = pct + '%';
    const sec = Math.floor((pausedElapsed + (Date.now() - startTime)) / 1000);
    const m = Math.floor(sec / 60), ss = sec % 60;
    const wDone = Math.round(pct / 100 * totalWords);
    document.getElementById('progSub').innerHTML = `${m}:${ss<10?'0':''}${ss}<br>${wDone} / ${totalWords} Wörter`;
    if (pct >= 100) {
      clearInterval(progInterval);
      setState('idle');
      if (texts[curIdx]) texts[curIdx].status = 'done';
      renderList();
    }
  }, 250);
}

// Listen for changes from settings page
window.addEventListener('storage', e => {
  if (e.key === STORE+'texts') { texts = JSON.parse(e.newValue || '[]'); renderList(); }
});

// Keyboard / pedal
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (state !== 'running') doCue(); }
});

loadTexts();
setState('idle');
</script>
</body>
</html>
