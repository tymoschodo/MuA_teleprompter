<!DOCTYPE html>
<html lang="de"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Titel-Operator — Teleprompter</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@100;200;300;400;500;600;700;800;900&family=Julius+Sans+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="panel.css">
</head><body>
<div class="page">
<div class="topbar">
  <h1 style="color:#ff6b35">Titel-Operator</h1>
  <span class="pill idle" id="pill">BEREIT</span>
  <span style="font-family:var(--mono);font-size:.58rem;color:var(--mu)" id="idxDisp">—</span>
  <span style="margin-left:auto"></span>
  
  <a class="btn btn-sm btn-ac" href="projection-back.html" target="_blank">▶ Projektion</a>
</div>
<div class="sidebar">
  <div class="cue-panel">
    <div class="prog-lbl">Aktuell</div>
    <div class="prog-title" id="curTitle">—</div>
    <div class="prog-bar"><div class="prog-fill" id="fill"></div></div>
    <div class="prog-meta">
      <div class="prog-pct" id="pct">0%</div>
      <div class="prog-sub" id="sub">0:00<br>0 / 0</div>
    </div>
    <div class="cue-btns">
      <button class="btn btn-back" id="btnBack" onclick="doBack()" disabled>◀</button>
      <button class="btn btn-cue"  id="btnCue"  onclick="doCue()" style="grid-column:span 2">▶ CUE</button>
      <button class="btn btn-stop" id="btnStop" onclick="doStop()" disabled>⏹</button>
    </div>
  </div>
  <div class="list-wrap" id="textList"></div>
  <div class="list-btns">
    <button class="btn btn-sm" onclick="addText()">+ Neu</button>
    <button class="btn btn-sm btn-dn" onclick="delText()">Löschen</button>
    <button class="btn btn-sm" onclick="moveUp()">↑</button>
    <button class="btn btn-sm" onclick="moveDown()">↓</button>
  </div>
  <div class="hint">Leertaste/Pedal → CUE &nbsp;·&nbsp; ← → zurück/vor</div>
</div>
<div class="main">

  <!-- Text editor -->
  <div class="section">
    <h2>Text bearbeiten</h2>
    <label>Titel</label>
    <input type="text" id="eTitle" placeholder="z.B. 1. Akt" oninput="saveEdit()">
    <label>Cue (Taktnummer / Kommentar)</label>
    <input type="text" id="eCue" placeholder="z.B. T.42 — nach dem Akkord" oninput="saveEdit()">
    <label>Inhalt</label>
    <textarea id="eContent" rows="4" placeholder="Text hier eingeben…" oninput="saveEdit()"></textarea>
    <label>Stil zuweisen</label>
    <select id="eStyle" class="style-select" onchange="saveEdit()">
      <option value="">— Kein Stil (Defaults) —</option>
    </select>
    <hr style="margin:.85rem 0">
    <h2>Ausnahmen (überschreiben den Stil)</h2>
    <div class="two-col">
      <div>
        <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem">
          <label class="tog" style="margin:0"><input type="checkbox" id="eSpeedActive" onchange="var e=document.getElementById('eSpeed');e.disabled=!this.checked;saveEdit()"><span class="tslide"></span></label>
          <label style="margin:0;font-size:.66rem">Geschwindigkeit</label>
        </div>
        <div class="rrow">
          <input type="range" id="eSpeed" min="10" max="300" step="5" value="60" disabled
            oninput="document.getElementById('eSpeedVal').textContent=this.value+' px/s';saveEdit()">
          <span class="rval" id="eSpeedVal">60 px/s</span>
        </div>
      </div>
      <div>
        <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem">
          <label class="tog" style="margin:0"><input type="checkbox" id="eDurActive" onchange="var e=document.getElementById('eDur');e.disabled=!this.checked;saveEdit()"><span class="tslide"></span></label>
          <label style="margin:0;font-size:.66rem">Anzeigedauer</label>
        </div>
        <div class="rrow">
          <input type="range" id="eDur" min="1" max="30" step="0.5" value="5" disabled
            oninput="document.getElementById('eDurVal').textContent=parseFloat(this.value).toFixed(1)+'s';saveEdit()">
          <span class="rval" id="eDurVal">5.0s</span>
        </div>
      </div>
    </div>
    <hr style="margin:.85rem 0">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.4rem">
      <h2 style="margin:0">Position (Ausnahme)</h2>
      <span id="ePosStatus" style="font-family:var(--mono);font-size:.6rem;padding:.15rem .5rem;border-radius:3px;border:1px solid var(--bd);color:var(--mu)">Vom Stil</span>
    </div>
    <div class="pos-wrap">
      <div class="pos-picker" id="ePosPicker" style="opacity:0.4"></div>
      <div class="pos-sliders">
        <label style="margin-top:0">Horizontal</label>
        <div class="rrow">
          <input type="range" id="ePosX" min="0" max="100" step="1" value="50"
            oninput="document.getElementById('ePosXVal').textContent=this.value+'%';syncPosPickerToValues('ePosPicker','ePosX','ePosY');document.getElementById('ePosPicker').style.opacity='1';document.getElementById('ePosStatus').textContent='Individuell';document.getElementById('ePosStatus').style.color='var(--ac2)';document.getElementById('ePosStatus').style.borderColor='var(--ac2)';saveEdit()">
          <span class="rval" id="ePosXVal">50%</span>
        </div>
        <label>Vertikal</label>
        <div class="rrow">
          <input type="range" id="ePosY" min="0" max="100" step="1" value="50"
            oninput="document.getElementById('ePosYVal').textContent=this.value+'%';syncPosPickerToValues('ePosPicker','ePosX','ePosY');document.getElementById('ePosPicker').style.opacity='1';document.getElementById('ePosStatus').textContent='Individuell';document.getElementById('ePosStatus').style.color='var(--ac2)';document.getElementById('ePosStatus').style.borderColor='var(--ac2)';saveEdit()">
          <span class="rval" id="ePosYVal">50%</span>
        </div>
        <button class="btn btn-sm" style="margin-top:.6rem;width:100%" onclick="clearPosOverride()">↺ Vom Stil verwenden</button>
      </div>
    </div>
    <div class="info" id="eInfo">Kein Text ausgewählt</div>
  </div>

  <!-- Style library -->
  <div class="section">
    <h2>Stil-Bibliothek</h2>
    <div class="list-wrap" id="styleList" style="max-height:180px;margin-bottom:.6rem"></div>
    <div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.85rem">
      <button class="btn btn-sm" onclick="addStyle()">+ Neu</button>
      <button class="btn btn-sm" onclick="dupStyle()">⧉ Kopie</button>
      <button class="btn btn-sm btn-dn" onclick="delStyle()">Löschen</button>
    </div>
    <div id="styleEditor"></div>
  </div>

  <!-- Data -->
  <div class="section" style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap">
    <h2 style="margin:0">Daten:</h2>
    <button class="btn btn-sm" onclick="exportData()">↓ Export</button>
    <button class="btn btn-sm" onclick="document.getElementById('iFile').click()">↑ Import</button>
    <input type="file" id="iFile" accept=".json" style="display:none" onchange="importData(event)">
    <button class="btn btn-sm btn-dn" onclick="if(confirm('Zurücksetzen?'))initDefaults()">↺ Reset</button>
    <button class="btn btn-sm" onclick="exportAllAsPNG()" style="border-color:#a0a0ff;color:#a0a0ff">⬇ Alle PNG</button>
    <div style="margin-left:auto;display:flex;align-items:center;gap:.5rem">
      <span id="cloudStatus" style="font-family:var(--mono);font-size:.62rem;transition:color .3s"></span>
      <button class="btn btn-sm" onclick="loadFromCloud()" style="border-color:#4a9eff;color:#4a9eff">☁ Laden</button>
      <button class="btn btn-sm" onclick="saveToCloud()" style="border-color:#4a9eff;color:#4a9eff">☁ Speichern</button>
    </div>
  </div>

</div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-sync.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="control-panel.js"></script>
<script>
initPanel({ namespace:"tp_back_", keyboardCues:false, projectionUrl:"projection-back.html", defaultBg:"#000000", defaultColor:"#f0efe8", defaultMode:"display", label:"Titel-Operator" });
</script>
</body></html>
